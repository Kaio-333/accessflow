<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AccessFlow adapta qualquer página em tempo real para pessoas com dislexia e TDAH." />
  <title>AccessFlow - A web adaptada ao jeito como sua mente lê</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'OpenDyslexic';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@latest/latin-400-normal.woff2') format('woff2'),
           url('https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@latest/latin-400-normal.woff') format('woff');
    }
    @font-face {
      font-family: 'OpenDyslexic';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@latest/latin-700-normal.woff2') format('woff2'),
           url('https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@latest/latin-700-normal.woff') format('woff');
    }
  </style>
</head>
<body>
  <div id="app">
    <button id="hamburger" class="hamburger" aria-label="Abrir menu de navegação" aria-expanded="false">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <nav id="sidebar" class="sidebar" role="navigation" aria-label="Navegação principal">
      <div id="sidebar-root"></div>
    </nav>
    <div id="mobile-overlay" class="mobile-overlay" aria-hidden="true"></div>
    <main id="main-content" class="main-content" role="main">
      <div id="view-container"></div>
    </main>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
